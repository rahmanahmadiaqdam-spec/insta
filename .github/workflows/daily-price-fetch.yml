# این Workflow هرروز به‌صورت خودکار اجرا می‌شود، لیست محصولاتِ موجود
# سایت را از REST API ووکامرس می‌خواند، فایل data/daily-prices.json
# را می‌سازد/به‌روزرسانی می‌کند و همان لحظه آن را در همین ریپو کامیت می‌کند.
#
# نکته: مقادیر WC_BASE_URL، WC_CONSUMER_KEY و WC_CONSUMER_SECRET باید
# در تنظیمات ریپو به‌عنوان Repository Secrets تعریف شوند.

name: Daily WooCommerce Price Fetch

on:
  schedule:
    # 11:30 UTC = 15:00 به وقت ایران
    - cron: "30 11 * * *"
  workflow_dispatch: {} # امکان اجرای دستی از تب Actions

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
                  node-version: "22"

      - name: Run fetch script
        env:
          WC_BASE_URL: ${{ secrets.WC_BASE_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        run: node fetch-daily-prices.js

      - name: Commit updated data file
        run: |
          git config user.name "nolix-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-prices.json
          git diff --cached --quiet && echo "no changes" || git commit -m "daily price update $(date +'%Y-%m-%d')"
          git push
